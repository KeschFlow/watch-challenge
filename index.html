<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MG PRECISION CHALLENGE | BY EDDIE'S WORLD</title>
    <style>
        :root { 
            --titan: #e5e5e7; 
            --steel: #8e8e93; 
            --black: #000; 
            --white: #fff; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--black); color: var(--white); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        #bg-image { position: fixed; inset: 0; background-image: url('pacman_bg.png'), url('pacman_bg.jpg'); background-size: cover; background-position: center; z-index: 1; }
        #bg-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); z-index: 2; }

        /* Minimalistisches Profi-HUD */
        .hud { position: relative; z-index: 10; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; max-width: 900px; margin: 0 auto; width: 100%; }
        .stat { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border-bottom: 2px solid var(--titan); padding: 10px; text-align: center; }
        .stat .label { font-size: 10px; text-transform: uppercase; color: var(--steel); letter-spacing: 2px; margin-bottom: 5px; }
        .stat .value { font-size: 20px; font-weight: 300; letter-spacing: 1px; }

        .game-shell { position: relative; flex-grow: 1; z-index: 5; display: flex; justify-content: center; align-items: center; }
        canvas { max-width: 100%; max-height: 100%; cursor: pointer; z-index: 6; }

        /* Premium Overlays */
        .overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.9); display: flex; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; }
        .overlay.hidden { display: none !important; }
        .card { max-width: 440px; width: 100%; border: 1px solid var(--titan); padding: 50px 30px; background: var(--black); }
        
        h1 { color: var(--titan); font-size: 26px; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 10px; font-weight: 200; }
        .subtitle { font-size: 11px; color: var(--steel); letter-spacing: 3px; margin-bottom: 40px; text-transform: uppercase; }

        .btn { background: var(--titan); color: var(--black); border: none; padding: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; cursor: pointer; width: 100%; transition: all 0.3s; }
        .btn:hover { background: var(--white); letter-spacing: 5px; }

        .branding-footer { margin-top: 40px; border-top: 1px solid #222; padding-top: 20px; }
        .branding-footer p { font-size: 9px; color: #444; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
        .dev-link { color: var(--steel); text-decoration: none; font-weight: bold; font-size: 12px; letter-spacing: 1px; }
        
        @media (max-width: 600px) { .hud { padding: 10px; } h1 { font-size: 20px; } }
    </style>
</head>
<body>
    <div id="bg-image"></div>
    <div id="bg-overlay"></div>
    
    <section class="hud">
        <div class="stat"><div class="label">Score</div><div class="value" id="scoreValue">0</div></div>
        <div class="stat"><div class="label">Rekord</div><div class="value" id="bestValue">0</div></div>
        <div class="stat"><div class="label">Einheiten</div><div class="value" id="boxValue">2</div></div>
    </section>

    <main class="game-shell">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
        
        <div class="overlay" id="startOverlay">
            <div class="card">
                <h1>THE CHALLENGE</h1>
                <p class="subtitle">MARC GEBAUER x EDDIE'S WORLD</p>
                <button class="btn" id="startBtn">MISSION STARTEN</button>
                <div class="branding-footer">
                    <p>Technologie-Partner</p>
                    <a href="https://eddies.world" class="dev-link">WWW.EDDIES.WORLD</a>
                </div>
            </div>
        </div>

        <div class="overlay hidden" id="gameOverOverlay">
            <div class="card">
                <h1 style="color:#ff3b30; letter-spacing: 2px;">FOKUS VERLOREN</h1>
                <div id="finalScore" style="font-size:70px; color:var(--titan); margin:20px 0; font-weight:100;">0</div>
                <button class="btn" id="restartBtn">RETRY</button>
                <div class="branding-footer">
                    <p>Designed by</p>
                    <a href="https://eddies.world" class="dev-link">EDDIE'S WORLD PRECISION ENGINE</a>
                </div>
            </div>
        </div>
    </main>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let state = { running: false, score: 0, round: 1, boxCount: 2, best: localStorage.getItem("mg_best_titan")||0, phase: "idle", phaseStartedAt: 0, correctBoxId: null, selectedBoxId: null, swapsRemaining: 0, activeSwap: null };
    let boxes = [];
    document.getElementById("bestValue").textContent = state.best;

    class TitanBox {
        constructor(id, x, y, size) { this.id=id; this.x=x; this.y=y; this.w=size; this.h=size; this.lift=0; }
        draw() {
            ctx.save(); ctx.translate(this.x+this.w/2, this.y+this.h/2-this.lift);
            ctx.strokeStyle="rgba(229, 229, 231, 0.5)"; ctx.lineWidth=1; ctx.fillStyle="rgba(15,15,15,0.95)";
            ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h); ctx.strokeRect(-this.w/2, -this.h/2, this.w, this.h);
            if ((state.phase==="show" || state.phase==="reveal") && this.id===state.correctBoxId) {
                ctx.fillStyle="#fff"; ctx.beginPath(); ctx.moveTo(-15,-5); ctx.lineTo(15,-5); ctx.lineTo(15,-15); ctx.lineTo(8,-10); ctx.lineTo(0,-20); ctx.lineTo(-8,-10); ctx.lineTo(-15,-15); ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }
    }

    function setPhase(p) { state.phase = p; state.phaseStartedAt = performance.now(); }
    function buildRound() {
        boxes = []; const count = state.boxCount; const size = Math.min(100, (canvas.width/(count+2))); const spacing = 30; const totalW = count*size + (count-1)*spacing;
        let startX = (canvas.width-totalW)/2;
        for(let i=0; i<count; i++) boxes.push(new TitanBox(i, startX+i*(size+spacing), canvas.height/2-size/2, size));
        state.correctBoxId = Math.floor(Math.random()*count); state.swapsRemaining = 4+Math.floor(state.score*1.1);
        setPhase("show"); setTimeout(() => { if(state.running) setPhase("shuffle"); }, 1100);
    }

    function shuffle() {
        if(state.swapsRemaining<=0) { setPhase("pick"); return; }
        let a=Math.floor(Math.random()*boxes.length), b=Math.floor(Math.random()*boxes.length);
        while(a===b) b=Math.floor(Math.random()*boxes.length);
        state.activeSwap = { aIdx: a, bIdx: b, startX: boxes[a].x, targetX: boxes[b].x, progress: 0, speed: Math.min(0.2, 0.08+(state.score*0.008)) };
        state.swapsRemaining--;
    }

    function update() {
        if(state.phase==="shuffle") {
            if(!state.activeSwap) shuffle();
            else {
                state.activeSwap.progress += state.activeSwap.speed; const p = Math.min(1, state.activeSwap.progress);
                const ease = p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2, 2)/2;
                boxes[state.activeSwap.aIdx].x = state.activeSwap.startX + (state.activeSwap.targetX-state.activeSwap.startX) * ease;
                boxes[state.activeSwap.bIdx].x = state.activeSwap.targetX + (state.activeSwap.startX-state.activeSwap.targetX) * ease;
                if(p>=1) state.activeSwap=null;
            }
        }
        if(state.phase==="reveal") {
            boxes.forEach(b => { if(b.id===state.correctBoxId || b.id===state.selectedBoxId) b.lift = Math.min(45, b.lift+5); });
            if(performance.now()-state.phaseStartedAt > 1400) {
                if(state.selectedBoxId===state.correctBoxId) { 
                    state.score++; state.round++; state.boxCount=Math.min(5, 2+Math.floor(state.score/3.5)); 
                    updateHUD(); buildRound(); 
                } else { endGame(); }
            }
        }
    }

    function loop() { if(state.running || state.phase==="reveal") update(); ctx.clearRect(0,0,canvas.width,canvas.height); boxes.forEach(b=>b.draw()); requestAnimationFrame(loop); }
    function updateHUD() { document.getElementById("scoreValue").textContent=state.score; document.getElementById("bestValue").textContent=state.best; document.getElementById("boxValue").textContent=state.boxCount; }

    function endGame() {
        state.running = false;
        if(state.score > state.best) { state.best = state.score; localStorage.setItem("mg_best_titan", state.best); updateHUD(); }
        document.getElementById("finalScore").textContent = state.score;
        document.getElementById("gameOverOverlay").classList.remove("hidden");
    }

    function handleInput(e) {
        if(state.phase!=="pick") return;
        const rect=canvas.getBoundingClientRect();
        const clientX=e.clientX||(e.touches?e.touches[0].clientX:0);
        const clientY=e.clientY||(e.touches?e.touches[0].clientY:0);
        const clickX = (clientX-rect.left)*(canvas.width/rect.width), clickY = (clientY-rect.top)*(canvas.height/rect.height);
        boxes.forEach(b => { if(clickX>b.x && clickX<b.x+b.w && clickY>b.y && clickY<b.y+b.h) { if(navigator.vibrate) navigator.vibrate(20); state.selectedBoxId=b.id; setPhase("reveal"); } });
    }

    document.getElementById("startBtn").onclick=()=>{ document.getElementById("startOverlay").classList.add("hidden"); state.running=true; state.score=0; state.round=1; state.boxCount=2; updateHUD(); buildRound(); };
    document.getElementById("restartBtn").onclick=()=>location.reload();
    canvas.addEventListener("mousedown", handleInput); canvas.addEventListener("touchstart", (e)=>{e.preventDefault(); handleInput(e);}, {passive:false});
    loop();
</script>
</body>
</html>
