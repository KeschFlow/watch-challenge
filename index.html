<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOGO CHALLENGE | MASTER TEMPLATE</title>

    <!-- ======================================================================= -->
    <!-- 🎨 1. KUNDEN-BEREICH (KAROSSERIE) - HIER PASST DER KUNDE ALLES AN       -->
    <!-- ======================================================================= -->
    <script>
        const KUNDE = {
            titel: "LOGO CHALLENGE",
            untertitel: "Finde unser Logo! Behalte die Kiste im Auge.",
            btnStart: "TEST STARTEN",
            
            verlorenText: "LEIDER VERLOREN",
            gewonnenText: "MEISTER-LEISTUNG! 🏆",
            
            btnShopText: "ZUM SHOP GEHEN",
            shopLink: "https://marcgebauer.com", // Hier den Shop-Link eintragen
            btnRetryText: "ERNEUT VERSUCHEN",

            ranglisteTitel: "KARRIERE-ZIELE",
            rangSystem: [
                { minScore: 0,  titel: "Praktikant 🥉" },
                { minScore: 5,  titel: "Azubi 🥈" },
                { minScore: 10, titel: "Vorarbeiter 👷" },
                { minScore: 15, titel: "Meister 🥇" },
                { minScore: 25, titel: "OBERMACKER 👑" }
            ],

            btnShareText: "SCORE TEILEN",
            shareNachricht: "Ich habe in der Logo-Challenge Score {SCORE} erreicht! 👑 Schaffst du das auch? ",

            belohnungAktiv: true,           // Gutschein-System an/aus
            belohnungAbScore: 25,           // Ab welchem Score gibt es den Code?
            belohnungNachricht: "Hervorragend! Dein exklusiver Code:",
            belohnungCode: "MASTER-10",

            logoPfad: "logo.png",         // Das Kunden-Logo (transparentes PNG)
            kistenFarbe: "#000000",       // Die Farbe der Kisten
            symbolFarbe: "#ffffff"        // Fallback-Farbe (Krone)
        };
    </script>

    <style>
        :root {
            --hintergrund: #e0e0e0;
            --hauptfarbe: #c5a059;
            --akzentfarbe: #000000;
            --text-hell: #ffffff;
            --karten-bg: #1a1a1a;
            --karten-text: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--hintergrund); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .hidden { display: none !important; }
        
        /* HUD Header */
        .hud { background: var(--akzentfarbe); color: var(--text-hell); display: grid; grid-template-columns: repeat(3, 1fr); padding: 15px; border-bottom: 3px solid var(--hauptfarbe); z-index: 20; }
        .stat { text-align: center; }
        .stat .label { font-size: 9px; text-transform: uppercase; color: var(--hauptfarbe); letter-spacing: 1px; }
        .stat .value { font-size: 20px; font-weight: bold; }

        /* Spielfeld */
        .game-shell { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; width: 100%; height: 100%; }
        canvas { background: linear-gradient(145deg, #ffffff, #f2f2f2); box-shadow: 0 25px 60px rgba(0,0,0,0.3); border-radius: 24px; border: 4px solid var(--hauptfarbe); max-width: 95vw; max-height: 70vh; cursor: pointer; }

        /* Menüs */
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .card { max-width: 450px; width: 95%; background: var(--karten-bg); padding: 35px 25px; text-align: center; border-radius: 12px; border-top: 5px solid var(--hauptfarbe); color: var(--karten-text); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        h1 { font-size: 26px; margin-bottom: 8px; letter-spacing: 1px; }
        
        .ranks-container { background: #222; border-radius: 8px; padding: 15px; margin: 20px 0; border: 1px solid #333; }
        #rankList li { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333; font-size: 14px; list-style: none; }
        #rankList li:last-child { border-bottom: none; }
        
        .reward-box { background: rgba(197, 160, 89, 0.15); border: 2px dashed var(--hauptfarbe); padding: 18px; margin: 18px 0; border-radius: 8px; }
        
        /* Buttons */
        .btn { border: none; padding: 16px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 6px; margin-bottom: 12px; transition: transform 0.1s; }
        .btn:active { transform: scale(0.97); }
        .btn-collection { background: var(--hauptfarbe); color: #000; font-size: 18px; text-transform: uppercase; }
        .btn-share { background: #25D366; color: #fff; flex: 1; }
        .btn-retry { background: #333; color: #fff; flex: 1; border: 1px solid #444; }
    </style>
</head>
<body>
    <section class="hud">
        <div class="stat"><div class="label">Score</div><div class="value" id="scoreValue">0</div></div>
        <div class="stat"><div class="label">Rekord</div><div class="value" id="bestValue">0</div></div>
        <div class="stat"><div class="label">Kisten</div><div class="value" id="boxValue">2</div></div>
    </section>

    <main class="game-shell">
        <canvas id="gameCanvas" width="800" height="800"></canvas>
        
        <!-- Start Menü -->
        <div class="overlay" id="startOverlay">
            <div class="card">
                <h1 id="ui-title">LOGO CHALLENGE</h1>
                <p id="ui-subtitle" style="color: #bbb; margin-bottom: 25px;"></p>
                <button class="btn btn-collection" id="startBtn"></button>
            </div>
        </div>

        <!-- Game Over Menü -->
        <div class="overlay hidden" id="gameOverOverlay">
            <div class="card">
                <h1 id="ui-lost-title"></h1>
                <div id="finalScore" style="font-size:60px; font-weight:bold; color:var(--hauptfarbe); line-height: 1;">0</div>
                <div id="ui-rank-display" style="font-weight:bold; margin: 10px 0; font-size: 18px;"></div>
                
                <div id="rewardSection" class="reward-box hidden">
                    <div id="ui-reward-msg" style="font-size: 13px;"></div>
                    <div id="ui-reward-code" style="font-size:24px; font-weight:bold; color:var(--hauptfarbe); letter-spacing: 2px;"></div>
                </div>

                <div class="ranks-container">
                    <h3 id="ui-lb-title" style="font-size: 12px; color: var(--hauptfarbe); text-transform: uppercase; margin-bottom: 10px;"></h3>
                    <ul id="rankList"></ul>
                </div>

                <button class="btn btn-collection" id="collectionBtn"></button>
                <div style="display:flex; gap:12px;">
                    <button class="btn btn-share" id="shareBtn">TEILEN</button>
                    <button class="btn btn-retry" id="restartBtn">RETRY</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById("gameCanvas"), ctx = canvas.getContext("2d");
        const kundeLogo = new Image(); kundeLogo.src = KUNDE.logoPfad;
        
        let boxes = [];
        let state = { 
            running: false, 
            score: 0, 
            boxCount: 2, 
            best: localStorage.getItem("lc_record_v2")||0, 
            phase: "idle", 
            correctBoxId: null, 
            selectedBoxId: null, 
            swapsRemaining: 0, 
            activeSwap: null, 
            startIdx: 0 
        };

        // UI Initialisierung
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('ui-title').textContent = KUNDE.titel;
            document.getElementById('ui-subtitle').textContent = KUNDE.untertitel;
            document.getElementById('startBtn').textContent = KUNDE.btnStart;
            document.getElementById('collectionBtn').textContent = KUNDE.btnShopText;
            document.getElementById('restartBtn').textContent = KUNDE.btnRetryText;
            document.getElementById('ui-lb-title').textContent = KUNDE.ranglisteTitel;
            document.getElementById('shareBtn').textContent = KUNDE.btnShareText;
            document.getElementById("bestValue").textContent = state.best;
            
            const list = document.getElementById("rankList");
            [...KUNDE.rangSystem].reverse().forEach(r => {
                list.innerHTML += `<li><span>${r.titel}</span><span style="color:var(--hauptfarbe)">ab ${r.minScore}</span></li>`;
            });
        });

        class Box {
            constructor(id, x, y, size) { 
                this.id = id; this.x = x; this.y = y; this.w = size; this.h = size; this.lift = 0; 
            }
            draw() {
                ctx.save(); ctx.translate(this.x + this.w/2, this.y + this.h/2 - this.lift);
                
                // Schatten & Körper
                ctx.shadowColor = "rgba(0,0,0,0.4)"; ctx.shadowBlur = 15; ctx.shadowOffsetY = 8;
                ctx.fillStyle = KUNDE.kistenFarbe;
                if(ctx.roundRect) ctx.roundRect(-this.w/2, -this.h/2, this.w, this.h, this.w * 0.15); 
                else ctx.rect(-this.w/2, -this.h/2, this.w, this.h);
                ctx.fill();
                
                // Inhalt
                if ((state.phase === "show" || state.phase === "reveal") && this.id === state.correctBoxId) {
                    if (kundeLogo.complete && kundeLogo.naturalWidth !== 0) {
                        const imgSize = this.w * 0.7;
                        ctx.drawImage(kundeLogo, -imgSize/2, -imgSize/2, imgSize, imgSize);
                    } else {
                        // Notfall-Krone
                        ctx.fillStyle = KUNDE.symbolFarbe;
                        const s = this.w * 0.25;
                        ctx.beginPath();
                        ctx.moveTo(-s, s*0.5); ctx.lineTo(s, s*0.5); ctx.lineTo(s, -s*0.5);
                        ctx.lineTo(s*0.5, 0); ctx.lineTo(0, -s*1.2); ctx.lineTo(-s*0.5, 0);
                        ctx.lineTo(-s, -s*0.5); ctx.closePath(); ctx.fill();
                    }
                }
                ctx.restore();
            }
        }

        function buildRound() {
            state.phase = "transition";
            state.selectedBoxId = null;
            state.activeSwap = null;
            
            // Score-abhängige Kistenanzahl
            state.boxCount = Math.min(25, 2 + Math.floor(state.score / 2));
            document.getElementById("boxValue").textContent = state.boxCount;

            // DYNAMISCHE SKALIERUNG
            const cols = Math.ceil(Math.sqrt(state.boxCount));
            const rows = Math.ceil(state.boxCount / cols);
            const area = 650; // Verfügbarer Platz im Canvas
            const padding = 25;
            
            // Berechne optimale Kistengröße
            const size = Math.min((area - (cols - 1) * padding) / cols, (area - (rows - 1) * padding) / rows);
            
            // Zentrierung
            const gridW = cols * size + (cols - 1) * padding;
            const gridH = rows * size + (rows - 1) * padding;
            const startX = (canvas.width - gridW) / 2;
            const startY = (canvas.height - gridH) / 2;

            boxes = [];
            for(let i = 0; i < state.boxCount; i++) {
                const x = startX + (i % cols) * (size + padding);
                const y = startY + Math.floor(i / cols) * (size + padding);
                boxes.push(new Box(i, x, y, size));
            }
            
            state.correctBoxId = Math.floor(Math.random() * state.boxCount);
            state.startIdx = state.correctBoxId; // Startposition merken
            
            // Schwierigkeit
            state.swapsRemaining = 6 + Math.floor(state.score * 2);
            state.phase = "show";
            
            setTimeout(() => { if(state.running) state.phase = "shuffle"; }, 1300);
        }

        function shuffle() {
            // Anti-Camper: Am Ende prüfen, ob die Kiste am Startplatz ist
            if(state.swapsRemaining <= 0) {
                if(state.correctBoxId === state.startIdx) {
                    state.swapsRemaining = 1; // Einen letzten Tausch erzwingen
                } else {
                    state.phase = "pick"; return;
                }
            }

            let a = Math.floor(Math.random() * boxes.length);
            let b = Math.floor(Math.random() * boxes.length);
            while(a === b) b = Math.floor(Math.random() * boxes.length);

            // Dynamischer Speed-Boost
            const speed = Math.min(0.22, 0.045 + (state.score * 0.008));
            
            state.activeSwap = { 
                aIdx: a, bIdx: b, 
                sax: boxes[a].x, say: boxes[a].y, 
                sbx: boxes[b].x, sby: boxes[b].y, 
                p: 0, spd: speed 
            };
            state.swapsRemaining--;
        }

        function update() {
            if(state.phase === "shuffle") {
                if(!state.activeSwap) shuffle();
                else {
                    state.activeSwap.p += state.activeSwap.spd;
                    const p = Math.min(1, state.activeSwap.p);
                    const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
                    
                    boxes[state.activeSwap.aIdx].x = state.activeSwap.sax + (state.activeSwap.sbx - state.activeSwap.sax) * ease;
                    boxes[state.activeSwap.aIdx].y = state.activeSwap.say + (state.activeSwap.sby - state.activeSwap.say) * ease;
                    boxes[state.activeSwap.bIdx].x = state.activeSwap.sbx + (state.activeSwap.sax - state.activeSwap.sbx) * ease;
                    boxes[state.activeSwap.bIdx].y = state.activeSwap.sby + (state.activeSwap.say - state.activeSwap.sby) * ease;
                    
                    if(p >= 1) {
                        // IDs tauschen für die korrekte Kistenerkennung
                        let tid = boxes[state.activeSwap.aIdx].id;
                        boxes[state.activeSwap.aIdx].id = boxes[state.activeSwap.bIdx].id;
                        boxes[state.activeSwap.bIdx].id = tid;
                        state.activeSwap = null;
                    }
                }
            }
            if(state.phase === "reveal") {
                boxes.forEach(bx => { 
                    if(bx.id === state.correctBoxId || bx.id === state.selectedBoxId) bx.lift = Math.min(50, bx.lift + 6); 
                });
                
                if(state.selectedBoxId === state.correctBoxId) {
                    setTimeout(() => { 
                        if(state.phase === "reveal") { 
                            state.score++; buildRound(); 
                            document.getElementById("scoreValue").textContent = state.score; 
                        } 
                    }, 1600);
                    state.phase = "waiting";
                } else if(state.selectedBoxId !== null) {
                    setTimeout(endGame, 800);
                    state.phase = "dead";
                }
            }
        }

        function loop() {
            if(state.running || state.phase === "reveal" || state.phase === "waiting") update();
            ctx.clearRect(0,0,canvas.width,canvas.height);
            boxes.forEach(bx => bx.draw());
            requestAnimationFrame(loop);
        }

        function endGame() {
            state.running = false;
            if(state.score > state.best) {
                state.best = state.score;
                localStorage.setItem("lc_record_v2", state.best);
                document.getElementById("bestValue").textContent = state.best;
            }
            document.getElementById("finalScore").textContent = state.score;
            
            // Rang ermitteln
            let rank = KUNDE.rangSystem.filter(r => state.score >= r.minScore).pop();
            document.getElementById("ui-rank-display").textContent = rank.titel;
            
            // Belohnung prüfen
            const rew = document.getElementById("rewardSection");
            const title = document.getElementById("ui-lost-title");
            if(KUNDE.belohnungAktiv && state.score >= KUNDE.belohnungAbScore) {
                title.textContent = KUNDE.gewonnenText;
                title.style.color = "var(--hauptfarbe)";
                document.getElementById("ui-reward-msg").textContent = KUNDE.belohnungNachricht;
                document.getElementById("ui-reward-code").textContent = KUNDE.belohnungCode;
                rew.classList.remove("hidden");
            } else {
                title.textContent = KUNDE.verlorenText;
                title.style.color = "#ff4444";
                rew.classList.add("hidden");
            }
            
            document.getElementById("gameOverOverlay").classList.remove("hidden");
        }

        function handleInput(e) {
            if(state.phase !== "pick") return;
            const rect = canvas.getBoundingClientRect();
            let cx = ((e.clientX || e.touches[0].clientX) - rect.left) * (canvas.width/rect.width);
            let cy = ((e.clientY || e.touches[0].clientY) - rect.top) * (canvas.height/rect.height);
            
            boxes.forEach(bx => {
                if(cx > bx.x && cx < bx.x + bx.w && cy > bx.y && cy < bx.y + bx.h) {
                    state.selectedBoxId = bx.id;
                    state.phase = "reveal";
                }
            });
        }

        // Steuerung
        document.getElementById("startBtn").onclick = () => { 
            document.getElementById("startOverlay").classList.add("hidden"); 
            state.running = true; state.score = 0; buildRound(); 
        };
        document.getElementById("restartBtn").onclick = () => location.reload();
        document.getElementById("collectionBtn").onclick = () => window.open(KUNDE.shopLink, "_blank");
        document.getElementById("shareBtn").onclick = () => {
            const msg = KUNDE.shareNachricht.replace("{SCORE}", state.score) + window.location.href;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, "_blank");
        };

        canvas.addEventListener("mousedown", handleInput);
        canvas.addEventListener("touchstart", (e) => { e.preventDefault(); handleInput(e); }, {passive:false});
        
        loop();
    </script>
</body>
</html>
