<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MG PRECISION | FOCUS SYSTEM</title>
    <style>
        :root { 
            --mg-dark: #343536; 
            --mg-light: #f1f1f1; 
            --mg-gold: #c5a059; 
            --mg-box: #222222;
            --danger: #c92a2a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--mg-light); color: var(--mg-dark); height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }

        /* HUD */
        .hud { 
            position: absolute; top: 0; left: 0; right: 0;
            z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 0; padding: 12px 15px; background: var(--mg-dark);
            border-bottom: 3px solid var(--mg-gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .stat { text-align: center; border-right: 1px solid rgba(255,255,255,0.1); }
        .stat:last-child { border-right: none; }
        .stat .label { font-size: 9px; text-transform: uppercase; color: #aaa; letter-spacing: 2px; margin-bottom: 2px; }
        .stat .value { font-size: 20px; font-weight: bold; color: #fff; display: flex; align-items: center; justify-content: center; gap: 4px; }
        
        .eddie-live {
            position: absolute; top: 75px; left: 0; right: 0; text-align: center;
            font-size: 11px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
            color: #888; z-index: 15; height: 15px; transition: opacity 0.3s; pointer-events: none;
        }

        .streak-fire { color: #e67e22; font-size: 16px; animation: pulseFire 1.5s infinite alternate; }

        /* Spielfeld */
        .game-shell { flex-grow: 1; display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; padding-top: 60px; transition: transform 0.3s cubic-bezier(.17,.67,.83,.67); }
        .game-shell.pick-tension { transform: scale(1.03); } 
        
        canvas { 
            max-width: 95vw; 
            max-height: 75vh; 
            cursor: pointer; 
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.2)); 
            touch-action: none; /* VERHINDERT SCROLLEN AUF DEM CANVAS */
        }

        /* Overlays */
        .overlay { position: absolute; inset: 0; background: rgba(52, 53, 54, 0.95); display: flex; align-items: center; justify-content: center; z-index: 100; text-align: center; overflow-y: auto; padding: 20px; backdrop-filter: blur(5px); }
        .overlay.hidden { display: none !important; }
        
        .card { max-width: 440px; width: 100%; border-top: 4px solid var(--mg-gold); padding: 35px 25px; background: #fff; box-shadow: 0 20px 50px rgba(0,0,0,0.4); border-radius: 2px; position: relative; }
        
        h1 { font-size: 24px; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 5px; color: var(--mg-dark); font-weight: 900; }
        .subtitle { font-size: 10px; color: #888; margin-bottom: 25px; letter-spacing: 2px; text-transform: uppercase; }
        
        .btn { background: var(--mg-dark); color: #fff; border: none; padding: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; width: 100%; margin-bottom: 12px; transition: 0.2s; }
        .btn:hover { background: var(--mg-gold); }
        .btn-gold { background: var(--mg-gold); color: #000; }
        .btn-outline { background: #fff; color: var(--mg-dark); border: 2px solid var(--mg-dark); padding: 12px; font-size: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        .identity-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 4px; border-left: 3px solid var(--mg-gold); }
        .id-stat { text-align: left; }
        .id-stat span { display: block; font-size: 9px; color: #888; letter-spacing: 1px; text-transform: uppercase; }
        .id-stat strong { display: block; font-size: 14px; color: var(--mg-dark); font-weight: 900; }

        .lock-container { position: relative; margin-bottom: 20px; }
        .locked-content { filter: blur(6px); pointer-events: none; user-select: none; opacity: 0.6; transition: 0.5s; }
        .lock-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        .unlocked .locked-content { filter: blur(0); pointer-events: auto; opacity: 1; }
        .unlocked .lock-overlay { display: none; }

        .lb-container { margin: 25px 0; border: 1px solid #ddd; padding: 15px; background: #fafafa; border-radius: 4px; }
        .lb-title { font-size: 13px; font-weight: 900; letter-spacing: 2px; border-bottom: 2px solid var(--mg-dark); padding-bottom: 8px; margin-bottom: 10px; text-transform: uppercase; color: var(--mg-dark); }
        .lb-list { list-style: none; padding: 0; margin: 0; max-height: 180px; overflow-y: auto; }
        .lb-row { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; border-bottom: 1px solid #eee; }
        
        @keyframes pulseFire { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.2); opacity: 1; } }
        .shake-effect { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-15px); } 40%, 80% { transform: translateX(15px); } }
    </style>
</head>
<body>
    <section class="hud">
        <div class="stat"><div class="label">System Score</div><div class="value" id="scoreValue">0</div></div>
        <div class="stat"><div class="label">Daily Streak</div><div class="value" id="streakValue"><span class="streak-fire">🔥</span><span id="streakCount">0</span></div></div>
        <div class="stat"><div class="label">Best</div><div class="value" id="bestValue">0</div></div>
    </section>
    
    <div id="eddieLiveQuote" class="eddie-live"></div>

    <main class="game-shell" id="gameShell">
        <canvas id="gameCanvas"></canvas>
        
        <div class="overlay" id="startOverlay">
            <div class="card">
                <h1>FOCUS SYSTEM</h1>
                <p class="subtitle">MARC GEBAUER x EDDIE'S WORLD</p>
                <button class="btn" id="startBtn">SYSTEM STARTEN</button>
                <div class="lb-container">
                    <div class="lb-title">ELITE RANKING</div>
                    <ul class="lb-list" id="startLeaderboard"><li class="lb-loading">Lade Ranking...</li></ul>
                </div>
            </div>
        </div>

        <div class="overlay hidden" id="gameOverOverlay">
            <div class="card">
                <h1 style="color:var(--danger); margin-bottom:5px;">SYSTEM FAILED</h1>
                <p id="eddieQuote" style="font-size: 13px; color: #555; font-weight: bold; font-style: italic; margin-top: 8px; line-height: 1.4;"></p>
                <div id="finalScore" style="font-size:70px; font-weight:900; margin:15px 0; color: var(--mg-dark);">0</div>
                
                <div class="identity-grid">
                    <div class="id-stat"><span>Class</span><strong id="idClass">DISTRACTED</strong></div>
                    <div class="id-stat"><span>Avg React</span><strong id="idReact">0ms</strong></div>
                    <div class="id-stat"><span>Percentile</span><strong id="idPercentile">Top 99%</strong></div>
                    <div class="id-stat"><span>Status</span><strong id="idStatus" style="color:var(--mg-gold)">UNVERIFIED</strong></div>
                </div>
                
                <div id="viralLockContainer" class="lock-container">
                    <div class="lock-overlay">
                        <div style="font-size: 24px; margin-bottom: 10px;">🔒</div>
                        <p style="font-size: 11px; font-weight: bold; margin-bottom: 10px; color: #000; text-transform: uppercase;">Ranking Locked.</p>
                        <button class="btn btn-gold" id="shareBtnUnlock" style="margin-bottom:0;">EGO BEWEISEN (SHARE)</button>
                    </div>
                    <div class="locked-content" id="saveScoreSection">
                        <p style="font-size: 12px; font-weight: 900; margin-bottom: 10px; color: var(--mg-dark); text-transform: uppercase;">SPOT SICHERN:</p>
                        <input type="text" id="nameInput" placeholder="INSTAGRAM ODER WHATSAPP" maxlength="30" autocomplete="off">
                        <button class="btn btn-outline" id="saveBtn">INS RANKING AUFNEHMEN</button>
                    </div>
                </div>

                <div id="standardShare" style="display:none; margin-bottom: 15px;">
                    <button class="btn btn-outline" id="shareBtnStandard">EGO BEWEISEN (SHARE)</button>
                </div>

                <button class="btn" id="restartBtn">SYSTEM REBOOT</button>
                <a href="https://marcgebauer.com" target="_blank" style="color:#aaa; font-weight:bold; text-decoration:none; display:block; margin-top:20px; font-size:10px; text-transform:uppercase;">MARCGEBAUER.COM</a>
            </div>
        </div>
    </main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC0olKESyTP0rXUlnjGstLlGN50I1m_O2A",
      authDomain: "mg-challenge.firebaseapp.com",
      projectId: "mg-challenge",
      storageBucket: "mg-challenge.firebasestorage.app",
      messagingSenderId: "472289048663",
      appId: "1:472289048663:web:cc68ded6007e1e822c4b12"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    let currentUser = null;
    let unsubscribeLB = null;

    onAuthStateChanged(auth, (user) => { currentUser = user; if (user) loadLeaderboard(); else signInAnonymously(auth); });

    function loadLeaderboard() {
        if (unsubscribeLB) unsubscribeLB(); 
        unsubscribeLB = onSnapshot(collection(db, 'leaderboard'), (snapshot) => {
            let temp = [];
            snapshot.forEach(doc => temp.push(doc.data()));
            temp.sort((a, b) => b.score - a.score);
            const listEl = document.getElementById("startLeaderboard");
            listEl.innerHTML = temp.slice(0, 10).map((e, i) => `
                <li class="lb-row">
                    <span class="lb-rank">${i<3 ? ['🥇','🥈','🥉'][i] : '#'+(i+1)}</span>
                    <span class="lb-name">${e.name}</span>
                    <span class="lb-score">${e.score}</span>
                </li>`).join('') || '<li class="lb-loading">Noch keine Einträge.</li>';
        });
    }

    // --- GAME LOGIC ---
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    
    function playTone(f, t, d, v=0.1) {
        if(!audioCtx || audioCtx.state === 'suspended') return;
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(v, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d);
    }

    let state = { 
        running: false, score: 0, boxCount: 2, combo: 0, inputLocked: true,
        phase: "idle", phaseStartedAt: 0, pickStartTime: 0, reactionTimes: [],
        correctBoxId: null, selectedBoxId: null, swapsRemaining: 0, activeSwap: null
    };

    function setPhase(p) {
        state.phase = p;
        state.phaseStartedAt = performance.now();
        if (p === "pick") state.inputLocked = false;
        else state.inputLocked = true;
    }

    class Box {
        constructor(id, x, y, s) { this.id=id; this.x=x; this.y=y; this.w=s; this.h=s; this.lift=0; this.scale=1; this.z=0; }
        draw() {
            ctx.save(); ctx.translate(this.x+this.w/2, this.y+this.h/2-this.lift); ctx.scale(this.scale, this.scale);
            if (this.scale > 1) { ctx.shadowBlur = 15; ctx.shadowColor = "rgba(0,0,0,0.5)"; }
            ctx.fillStyle = "#222222"; ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.strokeRect(-this.w/2, -this.h/2, this.w, this.h);
            if ((state.phase==="show" || state.phase==="reveal") && this.id===state.correctBoxId) {
                ctx.fillStyle="#c5a059"; const s = this.w*0.2; ctx.beginPath();
                ctx.moveTo(-s, s*0.5); ctx.lineTo(s, s*0.5); ctx.lineTo(s, -s*0.5);
                ctx.lineTo(s*0.6, 0); ctx.lineTo(0, -s*1.2); ctx.lineTo(-s*0.6, 0);
                ctx.lineTo(-s, -s*0.5); ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }
    }

    let boxes = [];
    function buildRound() {
        boxes = []; const area = canvas.width * 0.8; const maxR = Math.floor(canvas.width / 120); 
        const cols = Math.min(maxR, Math.ceil(Math.sqrt(state.boxCount))); const rows = Math.ceil(state.boxCount / cols);
        const s = (area / maxR) - 10; const sp = 15;
        const tw = cols * s + (cols - 1) * sp; const th = rows * s + (rows - 1) * sp;
        const sx = (canvas.width - tw) / 2; const sy = (canvas.height - th) / 2;
        for (let i = 0; i < state.boxCount; i++) {
            const r = Math.floor(i / cols), c = i % cols;
            boxes.push(new Box(i, sx + c * (s + sp), sy + r * (s + sp), s));
        }
        state.correctBoxId = Math.floor(Math.random() * state.boxCount);
        state.swapsRemaining = 3 + Math.floor(state.score * 0.6);
        setPhase("show");
        document.getElementById("gameShell").classList.remove("pick-tension");
        setTimeout(() => { if(state.running) setPhase("shuffle"); }, state.score > 10 ? 800 : 1200);
    }

    function shuffle() {
        if (state.swapsRemaining <= 0) { 
            setPhase("pick"); 
            state.pickStartTime = performance.now();
            document.getElementById("gameShell").classList.add("pick-tension");
            return; 
        }
        let a = Math.floor(Math.random() * boxes.length), b = Math.floor(Math.random() * boxes.length);
        while(a === b) b = Math.floor(Math.random() * boxes.length);
        let speed = Math.min(0.18, 0.04 + state.score * 0.003);
        const distance = Math.abs(boxes[a].x - boxes[b].x) + Math.abs(boxes[a].y - boxes[b].y);
        state.activeSwap = { aIdx: a, bIdx: b, sax: boxes[a].x, say: boxes[a].y, sbx: boxes[b].x, sby: boxes[b].y, arcH: (Math.random() > 0.5 ? 1 : -1) * Math.min(distance * 0.35, 100), p: 0, spd: speed };
        state.swapsRemaining--;
    }

    function update() {
        if (state.phase === "shuffle") {
            if (!state.activeSwap) shuffle();
            else {
                state.activeSwap.p += state.activeSwap.spd; const p = Math.min(1, state.activeSwap.p);
                const ease = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
                const arc = Math.sin(p * Math.PI);
                const sign = Math.sign(state.activeSwap.arcH) || 1;
                boxes[state.activeSwap.aIdx].x = state.activeSwap.sax + (state.activeSwap.sbx - state.activeSwap.sax) * ease;
                boxes[state.activeSwap.aIdx].y = state.activeSwap.say + (state.activeSwap.sby - state.activeSwap.say) * ease - (state.activeSwap.arcH * arc);
                boxes[state.activeSwap.aIdx].scale = 1 - (sign * arc * 0.15);
                boxes[state.activeSwap.bIdx].x = state.activeSwap.sbx + (state.activeSwap.sax - state.activeSwap.sbx) * ease;
                boxes[state.activeSwap.bIdx].y = state.activeSwap.sby + (state.activeSwap.say - state.activeSwap.sby) * ease + (state.activeSwap.arcH * arc);
                boxes[state.activeSwap.bIdx].scale = 1 + (sign * arc * 0.15);
                if (p >= 1) {
                    boxes[state.activeSwap.aIdx].x = state.activeSwap.sbx; boxes[state.activeSwap.aIdx].y = state.activeSwap.sby; boxes[state.activeSwap.aIdx].scale = 1;
                    boxes[state.activeSwap.bIdx].x = state.activeSwap.sax; boxes[state.activeSwap.bIdx].y = state.activeSwap.say; boxes[state.activeSwap.bIdx].scale = 1;
                    state.activeSwap = null;
                }
            }
        }
        if (state.phase === "reveal") {
            boxes.forEach(bx => { if (bx.id === state.correctBoxId || bx.id === state.selectedBoxId) bx.lift = Math.min(45, bx.lift + 5); });
            if (performance.now() - state.phaseStartedAt > 1500) {
                if (state.selectedBoxId === state.correctBoxId) {
                    state.score += 1 + (state.combo > 1 ? Math.floor(state.combo * 0.5) : 0);
                    state.boxCount = Math.min(20, 2 + Math.floor(state.score / 4));
                    document.getElementById("scoreValue").textContent = state.score;
                    buildRound();
                } else endGame();
            }
        }
    }

    function loop() { 
        if (state.running || state.phase === "reveal") update(); ctx.clearRect(0, 0, canvas.width, canvas.height); 
        boxes.sort((a, b) => a.scale - b.scale).forEach(bx => bx.draw()); 
        requestAnimationFrame(loop); 
    }

    // --- UNIFIED UNIFIED INPUT SYSTEM ---
    function handleInput(e) {
        if(!audioCtx) audioCtx = new AudioContext();
        if (!state.running || state.phase !== "pick" || state.inputLocked) return;
        
        state.inputLocked = true; // LOCK IMMEDIATELY
        const rect = canvas.getBoundingClientRect();
        const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
        const cy = (e.clientY - rect.top) * (canvas.height / rect.height);
        
        let boxHit = false;
        boxes.forEach(bx => { 
            if (cx > bx.x && cx < bx.x + bx.w && cy > bx.y && cy < bx.y + bx.h) { 
                state.selectedBoxId = bx.id; boxHit = true;
                if(bx.id === state.correctBoxId) { state.combo++; playTone(880, 'sine', 0.1); } 
                else { state.combo = 0; playTone(150, 'sawtooth', 0.4); document.body.classList.add("shake-effect"); setTimeout(() => document.body.classList.remove("shake-effect"), 400); }
                setPhase("reveal"); 
            } 
        });
        if(!boxHit) { state.inputLocked = false; playTone(400, 'square', 0.05); }
    }

    function endGame() {
        state.running = false;
        document.getElementById("finalScore").textContent = state.score;
        const percentile = Math.min(99.9, Math.max(1, (1 - Math.exp(-state.score * 0.15)) * 100));
        document.getElementById("idPercentile").textContent = `Top ${(100 - percentile).toFixed(1)}%`;
        
        const viral = document.getElementById("viralLockContainer");
        if (state.score >= 7) {
            viral.style.display = "block"; viral.classList.remove("unlocked");
            document.getElementById("standardShare").style.display = "none";
        } else {
            viral.style.display = "none"; document.getElementById("standardShare").style.display = "block";
        }
        document.getElementById("gameOverOverlay").classList.remove("hidden");
    }

    canvas.addEventListener("pointerdown", handleInput);
    document.getElementById("startBtn").addEventListener("click", () => { document.getElementById("startOverlay").classList.add("hidden"); state.running = true; state.score = 0; state.boxCount = 2; buildRound(); });
    document.getElementById("restartBtn").addEventListener("click", () => { document.getElementById("gameOverOverlay").classList.add("hidden"); state.running = true; state.score = 0; state.boxCount = 2; buildRound(); });
    
    document.getElementById("shareBtnUnlock").addEventListener("click", () => {
        const text = `Mein Fokus Score: ${state.score}. Schaffst du mehr? ${window.location.href}`;
        if (navigator.share) navigator.share({ title: 'Focus System', text: text }).then(() => document.getElementById("viralLockContainer").classList.add("unlocked"));
        else { navigator.clipboard.writeText(text); document.getElementById("viralLockContainer").classList.add("unlocked"); }
    });

    document.getElementById("saveBtn").addEventListener("click", async () => {
        const name = document.getElementById("nameInput").value.trim() || "Gast";
        await setDoc(doc(db, 'leaderboard', currentUser.uid), { name, score: state.score, uid: currentUser.uid });
        document.getElementById("saveScoreSection").style.display = "none";
    });

    loop();
</script>
</body>
</html>
