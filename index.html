<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MG PRECISION | FOCUS CHALLENGE</title>
    <style>
        :root { 
            --mg-dark: #343536; 
            --mg-light: #f1f1f1; 
            --mg-gold: #c5a059; 
            --mg-box: #222222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--mg-light); color: var(--mg-dark); height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }

        /* HUD - MG Shop Style */
        .hud { 
            position: absolute; top: 0; left: 0; right: 0;
            z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 0; padding: 15px; background: var(--mg-dark);
            border-bottom: 3px solid var(--mg-gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .stat { text-align: center; border-right: 1px solid rgba(255,255,255,0.1); }
        .stat:last-child { border-right: none; }
        .stat .label { font-size: 9px; text-transform: uppercase; color: #aaa; letter-spacing: 2px; margin-bottom: 2px; }
        .stat .value { font-size: 20px; font-weight: bold; color: #fff; }

        /* Spielfeld */
        .game-shell { flex-grow: 1; display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; padding-top: 60px; }
        canvas { max-width: 95vw; max-height: 75vh; cursor: pointer; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.2)); }

        /* Overlays */
        .overlay { position: absolute; inset: 0; background: rgba(52, 53, 54, 0.95); display: flex; align-items: center; justify-content: center; z-index: 100; text-align: center; overflow-y: auto; padding: 20px; }
        .overlay.hidden { display: none !important; }
        
        .card { max-width: 440px; width: 100%; border-top: 4px solid var(--mg-gold); padding: 35px 25px; background: #fff; box-shadow: 0 20px 50px rgba(0,0,0,0.4); border-radius: 2px; }
        
        h1 { font-size: 24px; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 5px; color: var(--mg-dark); font-weight: 900; }
        .subtitle { font-size: 10px; color: #888; margin-bottom: 25px; letter-spacing: 2px; text-transform: uppercase; }
        
        .btn { background: var(--mg-dark); color: #fff; border: none; padding: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; width: 100%; margin-bottom: 12px; transition: 0.2s; }
        .btn:hover { background: var(--mg-gold); }
        .btn-gold { background: var(--mg-gold); color: #000; }
        .btn-outline { background: #fff; color: var(--mg-dark); border: 2px solid var(--mg-dark); padding: 12px; font-size: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        /* NETWORKING FOOTER */
        .networking-footer { margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee; }
        .networking-footer p { font-size: 8px; color: #aaa; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
        .dev-link { color: var(--mg-dark); text-decoration: none; font-size: 12px; font-weight: 900; letter-spacing: 2px; display: block; text-transform: uppercase; }
        .dev-link:hover { color: var(--mg-gold); }

        /* Leaderboard UI */
        .lb-container { margin: 25px 0; border: 1px solid #ddd; padding: 15px; background: #fafafa; border-radius: 4px; }
        .lb-title { font-size: 13px; font-weight: 900; letter-spacing: 2px; border-bottom: 2px solid var(--mg-dark); padding-bottom: 8px; margin-bottom: 10px; text-transform: uppercase; color: var(--mg-dark); }
        .lb-list { list-style: none; padding: 0; margin: 0; max-height: 180px; overflow-y: auto; }
        .lb-row { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; border-bottom: 1px solid #eee; }
        .lb-row:last-child { border-bottom: none; }
        .lb-rank { font-weight: bold; color: #888; width: 35px; text-align: left; }
        .lb-name { font-weight: bold; color: var(--mg-dark); flex-grow: 1; text-align: left; }
        .lb-score { font-weight: 900; color: var(--mg-gold); }
        .lb-loading { font-size: 12px; color: #888; font-style: italic; }

        #nameInput { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ccc; font-size: 15px; text-align: center; font-weight: bold; background: #fff; color: #000; outline: none; border-radius: 2px; }
        #nameInput:focus { border-color: var(--mg-gold); }
        
        .hard-mode-flash { animation: flashBg 0.5s ease-out; }
        @keyframes flashBg { 0% { background-color: var(--mg-gold); } 100% { background-color: var(--mg-light); } }
    </style>
</head>
<body>
    <section class="hud">
        <div class="stat"><div class="label">Score</div><div class="value" id="scoreValue">0</div></div>
        <div class="stat"><div class="label">Units</div><div class="value" id="boxValue">2</div></div>
        <div class="stat"><div class="label">Personal Best</div><div class="value" id="bestValue">0</div></div>
    </section>

    <main class="game-shell" id="gameShell">
        <canvas id="gameCanvas"></canvas>
        
        <div class="overlay" id="startOverlay">
            <div class="card">
                <h1>THE CHALLENGE</h1>
                <p class="subtitle">MARC GEBAUER x EDDIE'S WORLD</p>
                
                <button class="btn" id="startBtn">FOKUS STARTEN</button>
                
                <div class="lb-container">
                    <div class="lb-title">GLOBAL RANKING</div>
                    <ul class="lb-list" id="startLeaderboard">
                        <li class="lb-loading">Lade Ranking...</li>
                    </ul>
                </div>

                <div class="networking-footer">
                    <p>Engine built by</p>
                    <a href="mailto:Schulze.kevin81@gmail.com" class="dev-link">KEVIN SCHULZE</a>
                </div>
            </div>
        </div>

        <div class="overlay hidden" id="gameOverOverlay">
            <div class="card">
                <h1 style="color:#c92a2a; margin-bottom:5px;">FOKUS VERLOREN</h1>
                <p id="nearWinText" style="font-size:13px; color:#888; font-weight:bold; margin-top:5px; display:none;">Knapp daneben. Beweise deinen Fokus.</p>
                <div id="finalScore" style="font-size:80px; font-weight:900; margin:10px 0; color: var(--mg-dark);">0</div>
                
                <div id="shareSection" style="display: none; margin-bottom: 20px;">
                    <p style="font-size: 11px; font-weight: bold; margin-bottom: 10px; color: #000; text-transform: uppercase;">Zeig dem Netzwerk deinen Score:</p>
                    <button class="btn btn-outline" id="shareBtn" style="width: 100%;">SCORE TEILEN</button>
                </div>

                <div id="saveScoreSection" style="display: none; margin-bottom: 20px; padding-top: 15px; border-top: 1px solid #eee;">
                    <p style="font-size: 13px; font-weight: 900; margin-bottom: 15px; color: var(--mg-gold); text-transform: uppercase;">Neuer Rekord! Trage dich ein:</p>
                    <input type="text" id="nameInput" placeholder="DEIN NAME ODER INSTA-HANDLE" maxlength="20" autocomplete="off">
                    <button class="btn btn-gold" id="saveBtn">INS RANKING AUFNEHMEN</button>
                </div>

                <button class="btn" id="restartBtn">RETRY</button>
                <a href="https://marcgebauer.com" target="_blank" style="color:var(--mg-dark); font-weight:bold; text-decoration:none; display:block; margin-top:15px; font-size:12px; text-transform:uppercase;">MARCGEBAUER.COM</a>
            </div>
        </div>
    </main>

<script type="module">
    // --- DEIN ECHTES FIREBASE SETUP ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Hier sind deine echten Firebase-Keys
    const firebaseConfig = {
      apiKey: "AIzaSyC0olKESyTP0rXUlnjGstLlGN50I1m_O2A",
      authDomain: "mg-challenge.firebaseapp.com",
      projectId: "mg-challenge",
      storageBucket: "mg-challenge.firebasestorage.app",
      messagingSenderId: "472289048663",
      appId: "1:472289048663:web:cc68ded6007e1e822c4b12"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    let currentUser = null;
    let globalLeaderboard = [];
    let unsubscribeLB = null;

    // Anmeldung als anonymer Gast (ohne Passwort)
    const initAuth = async () => {
        try {
            await signInAnonymously(auth);
        } catch (e) { 
            console.error("Auth Error", e); 
        }
    };
    initAuth();

    onAuthStateChanged(auth, (user) => {
        currentUser = user;
        if (user) loadLeaderboard();
    });

    function loadLeaderboard() {
        if (!currentUser) return;
        if (unsubscribeLB) unsubscribeLB(); 
        
        // Greift auf die Tabelle "leaderboard" in DEINEM Projekt zu
        const lbRef = collection(db, 'leaderboard');
        
        unsubscribeLB = onSnapshot(lbRef, (snapshot) => {
            let temp = [];
            snapshot.forEach(doc => temp.push({ id: doc.id, ...doc.data() }));
            temp.sort((a, b) => b.score - a.score);
            globalLeaderboard = temp.slice(0, 10);
            renderLeaderboard();
        }, (err) => console.error("Snapshot Error:", err));
    }

    function renderLeaderboard() {
        const listEl = document.getElementById("startLeaderboard");
        if (globalLeaderboard.length === 0) {
            listEl.innerHTML = '<li class="lb-loading">Noch keine Einträge. Sei der Erste!</li>';
            return;
        }
        
        let html = "";
        globalLeaderboard.forEach((entry, index) => {
            let rankDisplay = `#${index + 1}`;
            if (index === 0) rankDisplay = "🥇";
            if (index === 1) rankDisplay = "🥈";
            if (index === 2) rankDisplay = "🥉";

            html += `
                <li class="lb-row">
                    <span class="lb-rank">${rankDisplay}</span>
                    <span class="lb-name">${escapeHTML(entry.name)}</span>
                    <span class="lb-score">${entry.score}</span>
                </li>`;
        });
        listEl.innerHTML = html;
    }

    async function saveScoreToDB(playerName, finalScore) {
        if (!currentUser || finalScore < 1) return false; 

        if (playerName.length < 2 || !/^[a-zA-Z0-9 _@.]+$/.test(playerName)) {
            const btn = document.getElementById("saveBtn");
            btn.textContent = "UNGUELTIGER NAME";
            setTimeout(() => { btn.textContent = "INS RANKING AUFNEHMEN"; btn.disabled = false; }, 2000);
            return false;
        }

        if (finalScore > 150) return false; 

        const existing = globalLeaderboard.find(e => e.uid === currentUser.uid);
        if (existing && existing.score >= finalScore) return true;

        // Speichert die Daten mit der User-ID, damit es keine Duplikate gibt
        const userDocRef = doc(db, 'leaderboard', currentUser.uid);
        try {
            await setDoc(userDocRef, {
                name: playerName,
                score: finalScore,
                uid: currentUser.uid,
                timestamp: Date.now()
            }, { merge: true }); 
            return true;
        } catch (e) { console.error("Save Error", e); return false; }
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
    }


    // --- GAME ENGINE ---
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    
    let boxes = [];
    let state = { 
        running: false, score: 0, boxCount: 2, 
        best: localStorage.getItem("mg_net_best") || 0, 
        phase: "idle", phaseStartedAt: 0, 
        correctBoxId: null, selectedBoxId: null, 
        swapsRemaining: 0, activeSwap: null,
        hardModeTriggered: false
    };

    document.getElementById("bestValue").textContent = state.best;

    function resizeCanvas() {
        const size = Math.min(window.innerWidth * 0.95, 800);
        canvas.width = size;
        canvas.height = size;
        if(state.running && state.phase === "pick") buildRound();
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class Box {
        constructor(id, x, y, size) { 
            this.id=id; this.x=x; this.y=y; this.w=size; this.h=size; 
            this.lift=0; 
            this.scale=1; // NEU: Für 3D-Tiefenwirkung
            this.z=0;     // NEU: Sortierung (vorne/hinten)
        }
        draw() {
            ctx.save(); 
            ctx.translate(this.x+this.w/2, this.y+this.h/2-this.lift);
            
            // 3D-Skalierung anwenden
            ctx.scale(this.scale, this.scale);
            
            // Leichter 3D-Schatten, der größer wird, wenn die Kiste "vorne" ist
            if (this.scale > 1) {
                ctx.shadowColor = "rgba(0,0,0,0.4)";
                ctx.shadowBlur = 15;
                ctx.shadowOffsetY = 10;
            }

            // Canvas versteht keine CSS-Variablen. Wieder echte Hex-Farben!
            ctx.fillStyle = "#222222"; // MG Anthrazit
            ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.strokeRect(-this.w/2, -this.h/2, this.w, this.h);

            if ((state.phase==="show" || state.phase==="reveal") && this.id===state.correctBoxId) {
                ctx.fillStyle="#c5a059"; // MG Gold
                const s = this.w*0.2; ctx.beginPath();
                ctx.moveTo(-s, s*0.5); ctx.lineTo(s, s*0.5); ctx.lineTo(s, -s*0.5);
                ctx.lineTo(s*0.6, 0); ctx.lineTo(0, -s*1.2); ctx.lineTo(-s*0.6, 0);
                ctx.lineTo(-s, -s*0.5); ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }
    }

    function buildRound() {
        boxes = []; 
        const area = canvas.width * 0.8;
        const maxR = Math.floor(canvas.width / 120); 
        const cols = Math.min(maxR, Math.ceil(Math.sqrt(state.boxCount)));
        const rows = Math.ceil(state.boxCount / cols);
        const s = (area / maxR) - 10;
        const sp = 15;
        const tw = cols * s + (cols - 1) * sp;
        const th = rows * s + (rows - 1) * sp;
        const sx = (canvas.width - tw) / 2;
        const sy = (canvas.height - th) / 2;

        for (let i = 0; i < state.boxCount; i++) {
            const r = Math.floor(i / cols), c = i % cols;
            boxes.push(new Box(i, sx + c * (s + sp), sy + r * (s + sp), s));
        }
        state.correctBoxId = Math.floor(Math.random() * state.boxCount);
        
        if (state.score === 10 && !state.hardModeTriggered) {
            state.hardModeTriggered = true;
            document.body.classList.add("hard-mode-flash");
            setTimeout(() => document.body.classList.remove("hard-mode-flash"), 500);
        }

        state.swapsRemaining = 3 + Math.floor(state.score * 0.6);
        setPhase("show");
        const showTime = state.score >= 10 ? 800 : 1200;
        setTimeout(() => { if(state.running) setPhase("shuffle"); }, showTime);
    }

    function shuffle() {
        if (state.swapsRemaining <= 0) { setPhase("pick"); return; }
        let a = Math.floor(Math.random() * boxes.length), b = Math.floor(Math.random() * boxes.length);
        while(a === b) b = Math.floor(Math.random() * boxes.length);
        
        // Knackigere Casino-Geschwindigkeit
        let baseSpeed = 0.04; 
        let maxSpeed = 0.12; 
        if (state.score >= 10) { baseSpeed = 0.06; maxSpeed = 0.18; }
        const speed = Math.min(maxSpeed, baseSpeed + state.score * 0.003);
        
        // Dynamische Bogenhöhe basierend auf der Distanz der Kisten
        const distance = Math.abs(boxes[a].x - boxes[b].x) + Math.abs(boxes[a].y - boxes[b].y);
        const direction = Math.random() > 0.5 ? 1 : -1;
        const arcHeight = direction * Math.min(distance * 0.35, 100);

        state.activeSwap = { 
            aIdx: a, bIdx: b, 
            sax: boxes[a].x, say: boxes[a].y, 
            sbx: boxes[b].x, sby: boxes[b].y, 
            arcH: arcHeight, p: 0, spd: speed 
        };
        state.swapsRemaining--;
    }

    function setPhase(p) { state.phase = p; state.phaseStartedAt = performance.now(); }

    function update() {
        if (state.phase === "shuffle") {
            if (!state.activeSwap) shuffle();
            else {
                state.activeSwap.p += state.activeSwap.spd; 
                const p = Math.min(1, state.activeSwap.p);
                
                // ULTIMATE PHYSICS: "Cubic Easing" (Startet zäh, peitscht in der Mitte, bremst weich)
                const ease = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
                const arc = Math.sin(p * Math.PI);
                
                // 3D Skalierung (Max 15% größer/kleiner)
                const scaleEffect = arc * 0.15;
                const sign = Math.sign(state.activeSwap.arcH) || 1;

                // Kiste A
                boxes[state.activeSwap.aIdx].x = state.activeSwap.sax + (state.activeSwap.sbx - state.activeSwap.sax) * ease;
                boxes[state.activeSwap.aIdx].y = state.activeSwap.say + (state.activeSwap.sby - state.activeSwap.say) * ease - (state.activeSwap.arcH * arc);
                boxes[state.activeSwap.aIdx].scale = 1 - (sign * scaleEffect);
                boxes[state.activeSwap.aIdx].z = boxes[state.activeSwap.aIdx].scale;

                // Kiste B (Gegenrichtung & Gegenskalierung)
                boxes[state.activeSwap.bIdx].x = state.activeSwap.sbx + (state.activeSwap.sax - state.activeSwap.sbx) * ease;
                boxes[state.activeSwap.bIdx].y = state.activeSwap.sby + (state.activeSwap.say - state.activeSwap.sby) * ease + (state.activeSwap.arcH * arc);
                boxes[state.activeSwap.bIdx].scale = 1 + (sign * scaleEffect);
                boxes[state.activeSwap.bIdx].z = boxes[state.activeSwap.bIdx].scale;
                
                if (p >= 1) {
                    // Reset nach dem Tausch
                    boxes[state.activeSwap.aIdx].x = state.activeSwap.sbx;
                    boxes[state.activeSwap.aIdx].y = state.activeSwap.sby;
                    boxes[state.activeSwap.aIdx].scale = 1;
                    boxes[state.activeSwap.aIdx].z = 0;

                    boxes[state.activeSwap.bIdx].x = state.activeSwap.sax;
                    boxes[state.activeSwap.bIdx].y = state.activeSwap.say;
                    boxes[state.activeSwap.bIdx].scale = 1;
                    boxes[state.activeSwap.bIdx].z = 0;
                    
                    state.activeSwap = null;
                }
            }
        }
        if (state.phase === "reveal") {
            boxes.forEach(bx => { if (bx.id === state.correctBoxId || bx.id === state.selectedBoxId) bx.lift = Math.min(45, bx.lift + 5); });
            if (performance.now() - state.phaseStartedAt > 1500) {
                if (state.selectedBoxId === state.correctBoxId) {
                    if (navigator.vibrate) navigator.vibrate(50);
                    state.score++; 
                    state.boxCount = Math.min(20, 2 + Math.floor(state.score / 2));
                    updateHUD(); buildRound();
                } else endGame();
            }
        }
    }

    function loop() { 
        if (state.running || state.phase === "reveal") update(); 
        ctx.clearRect(0, 0, canvas.width, canvas.height); 
        
        // ZEICHNEN MIT 3D-TIEFE: Kleinere Kisten zuerst zeichnen, größere überlagern sie!
        const sortedBoxes = [...boxes].sort((a, b) => a.z - b.z);
        sortedBoxes.forEach(bx => bx.draw()); 
        
        requestAnimationFrame(loop); 
    }
    
    function updateHUD() { 
        document.getElementById("scoreValue").textContent = state.score; 
        document.getElementById("bestValue").textContent = state.best;
        document.getElementById("boxValue").textContent = state.boxCount; 
    }

    function endGame() {
        state.running = false;
        
        if (state.score > state.best) { state.best = state.score; localStorage.setItem("mg_net_best", state.best); }
        document.getElementById("finalScore").textContent = state.score;
        updateHUD();

        const nearWinText = document.getElementById("nearWinText");
        nearWinText.style.display = (state.score >= 5 && state.selectedBoxId !== state.correctBoxId) ? "block" : "none";

        const shareSection = document.getElementById("shareSection");
        shareSection.style.display = (state.score >= 5) ? "block" : "none"; // Früherer Share-Trigger für Networking

        const saveSection = document.getElementById("saveScoreSection");
        saveSection.style.display = (state.score > 0) ? "block" : "none";

        document.getElementById("gameOverOverlay").classList.remove("hidden");
    }

    function handleInput(e) {
        if (state.phase !== "pick") return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches ? e.touches[e.touches.length-1].clientX : 0);
        const clientY = e.clientY || (e.touches ? e.touches[e.touches.length-1].clientY : 0);
        const cx = (clientX - rect.left) * (canvas.width / rect.width);
        const cy = (clientY - rect.top) * (canvas.height / rect.height);
        boxes.forEach(bx => { if (cx > bx.x && cx < bx.x + bx.w && cy > bx.y && cy < bx.y + bx.h) { state.selectedBoxId = bx.id; setPhase("reveal"); } });
    }

    // EVENT LISTENERS
    document.getElementById("startBtn").addEventListener("click", () => { 
        document.getElementById("startOverlay").classList.add("hidden"); 
        state.running = true; state.score = 0; state.boxCount = 2; state.hardModeTriggered = false;
        updateHUD(); buildRound(); 
    });
    
    document.getElementById("restartBtn").addEventListener("click", () => {
        document.getElementById("gameOverOverlay").classList.add("hidden");
        // FIX: Sofortiger Neustart der Challenge, kein Umweg über das Menü!
        state.running = true; 
        state.score = 0; 
        state.boxCount = 2; 
        state.hardModeTriggered = false;
        updateHUD(); 
        buildRound(); 
        
        // Leaderboard im Hintergrund heimlich neu laden
        if (currentUser) loadLeaderboard();
    });

    document.getElementById("saveBtn").addEventListener("click", async () => {
        const nameInput = document.getElementById("nameInput");
        const name = nameInput.value.trim() || "Gast";
        const btn = document.getElementById("saveBtn");
        
        btn.textContent = "SPEICHERT...";
        btn.disabled = true;
        
        const success = await saveScoreToDB(name, state.score);
        
        if (success) {
            document.getElementById("saveScoreSection").style.display = "none";
            nameInput.value = ""; 
            btn.textContent = "INS RANKING AUFNEHMEN"; btn.disabled = false;
        }
    });

    document.getElementById("shareBtn").addEventListener("click", () => {
        const shareText = `Ich habe Score ${state.score} in der Marc Gebauer Focus Challenge erreicht. Hast du den Fokus?`;
        const url = window.location.href;
        if (navigator.share) { navigator.share({ title: 'MG Challenge', text: shareText, url: url }).catch(console.error); } 
        else {
            navigator.clipboard.writeText(`${shareText} ${url}`);
            const btn = document.getElementById("shareBtn");
            btn.textContent = "LINK KOPIERT!";
            setTimeout(() => btn.textContent = "SCORE TEILEN", 2000);
        }
    });

    canvas.addEventListener("mousedown", handleInput);
    canvas.addEventListener("touchend", (e) => { e.preventDefault(); handleInput(e); }, {passive: false});
    
    // Initial Load
    loop();
</script>
