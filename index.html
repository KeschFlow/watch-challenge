<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MG PRECISION CHALLENGE | BOUTIQUE EDITION</title>
    <style>
        :root { 
            --gold: #d4af37; 
            --titan: #e5e5e7; 
            --dark-bg: #1a1a1c; 
            --box-color: #2a2a2e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: radial-gradient(circle at center, #2c2c30 0%, #121214 100%); 
            color: white; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }

        /* HUD - Sauber zentriert oben */
        .hud { 
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            z-index: 10; display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 15px; padding: 20px; width: 100%; max-width: 800px;
        }
        .stat { 
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); 
            padding: 10px; text-align: center; border-radius: 4px;
        }
        .stat .label { font-size: 10px; text-transform: uppercase; color: #888; letter-spacing: 2px; }
        .stat .value { font-size: 22px; font-weight: bold; color: var(--titan); }

        /* Das Spielfeld - Absolut mittig fixiert */
        .game-shell { 
            flex-grow: 1; display: flex; justify-content: center; align-items: center;
            width: 100%; height: 100%; padding-top: 80px;
        }
        canvas { 
            max-width: 95vw; max-height: 70vh; cursor: pointer; 
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.5));
        }

        /* Overlays */
        .overlay { 
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.9); 
            display: flex; align-items: center; justify-content: center; z-index: 100; text-align: center; 
        }
        .overlay.hidden { display: none !important; }
        .card { 
            max-width: 400px; width: 90%; border: 1px solid var(--gold); 
            padding: 40px; background: #111; border-radius: 2px;
        }
        
        h1 { font-size: 24px; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 20px; color: var(--gold); }
        .btn { 
            background: var(--gold); color: black; border: none; padding: 18px; 
            font-weight: 900; text-transform: uppercase; letter-spacing: 2px; 
            cursor: pointer; width: 100%; margin-bottom: 15px;
        }
        .dev-link { color: #555; text-decoration: none; font-size: 11px; letter-spacing: 1px; display: block; margin-top: 20px; }

    </style>
</head>
<body>
    
    <section class="hud">
        <div class="stat"><div class="label">Score</div><div class="value" id="scoreValue">0</div></div>
        <div class="stat"><div class="label">Rekord</div><div class="value" id="bestValue">0</div></div>
        <div class="stat"><div class="label">Boxen</div><div class="value" id="boxValue">2</div></div>
    </section>

    <main class="game-shell">
        <canvas id="gameCanvas" width="900" height="900"></canvas>
        
        <div class="overlay" id="startOverlay">
            <div class="card">
                <h1>THE CHALLENGE</h1>
                <button class="btn" id="startBtn">MISSION STARTEN</button>
                <a href="mailto:Schulze.kevin81@gmail.com" class="dev-link">GET THIS TOOL</a>
            </div>
        </div>

        <div class="overlay hidden" id="gameOverOverlay">
            <div class="card">
                <h1 style="color:#d93025;">FOKUS VERLOREN</h1>
                <div id="finalScore" style="font-size:80px; color:white; margin:20px 0; font-weight:100;">0</div>
                <button class="btn" id="restartBtn">RETRY</button>
                <a href="https://marcgebauer.com" target="_blank" style="color:var(--gold); text-decoration:none; font-size:12px;">MARCGEBAUER.COM</a>
            </div>
        </div>
    </main>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    
    let state = { running: false, score: 0, boxCount: 2, best: localStorage.getItem("mg_boutique_best") || 0, phase: "idle", phaseStartedAt: 0, correctBoxId: null, selectedBoxId: null, swapsRemaining: 0, activeSwap: null };
    document.getElementById("bestValue").textContent = state.best;

    class WatchBox {
        constructor(id, x, y, size) {
            this.id = id; this.x = x; this.y = y; this.w = size; this.h = size; this.lift = 0;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x + this.w/2, this.y + this.h/2 - this.lift);
            
            // Schatten
            ctx.shadowBlur = 15; ctx.shadowColor = "black";
            
            // Die Box (Dunkles Leder/Titan Design)
            ctx.fillStyle = "#2a2a2e";
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 2;
            ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
            ctx.strokeRect(-this.w/2, -this.h/2, this.w, this.h);
            
            // Silberner Verschluss/Detail
            ctx.fillStyle = "#e5e5e7";
            ctx.fillRect(-this.w*0.1, this.h*0.35, this.w*0.2, 5);

            // Die Krone (Gold)
            if ((state.phase === "show" || state.phase === "reveal") && this.id === state.correctBoxId) {
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#d4af37";
                const s = this.w * 0.18;
                ctx.beginPath();
                ctx.moveTo(-s, s*0.5); ctx.lineTo(s, s*0.5); ctx.lineTo(s, -s*0.5);
                ctx.lineTo(s*0.5, 0); ctx.lineTo(0, -s*1.2); ctx.lineTo(-s*0.5, 0);
                ctx.lineTo(-s, -s*0.5); ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }
    }

    function buildRound() {
        let boxesData = [];
        const areaSize = 750;
        const maxInRow = 5;
        const cols = Math.min(maxInRow, Math.ceil(Math.sqrt(state.boxCount)));
        const rows = Math.ceil(state.boxCount / cols);
        const boxSize = (areaSize / maxInRow) - 20; 
        const spacing = 20;
        
        const totalW = cols * boxSize + (cols - 1) * spacing;
        const totalH = rows * boxSize + (rows - 1) * spacing;
        const startX = (canvas.width - totalW) / 2;
        const startY = (canvas.height - totalH) / 2;

        for (let i = 0; i < state.boxCount; i++) {
            const r = Math.floor(i / cols), c = i % cols;
            boxesData.push(new WatchBox(i, startX + c * (boxSize + spacing), startY + r * (boxSize + spacing), boxSize));
        }
        boxes = boxesData;
        state.correctBoxId = Math.floor(Math.random() * state.boxCount);
        state.swapsRemaining = 3 + Math.floor(state.score * 0.4);
        setPhase("show");
        setTimeout(() => { if(state.running) setPhase("shuffle"); }, 1300);
    }

    function shuffle() {
        if (state.swapsRemaining <= 0) { setPhase("pick"); return; }
        let a = Math.floor(Math.random() * boxes.length), b = Math.floor(Math.random() * boxes.length);
        while(a === b) b = Math.floor(Math.random() * boxes.length);
        state.activeSwap = { aIdx: a, bIdx: b, startAX: boxes[a].x, startAY: boxes[a].y, startBX: boxes[b].x, startBY: boxes[b].y, progress: 0, speed: 0.03 + (state.score * 0.001) };
        state.swapsRemaining--;
    }

    function setPhase(p) { state.phase = p; state.phaseStartedAt = performance.now(); }

    function update() {
        if (state.phase === "shuffle") {
            if (!state.activeSwap) shuffle();
            else {
                state.activeSwap.progress += state.activeSwap.speed;
                const p = Math.min(1, state.activeSwap.progress);
                const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
                boxes[state.activeSwap.aIdx].x = state.activeSwap.startAX + (state.activeSwap.startBX - state.activeSwap.startAX) * ease;
                boxes[state.activeSwap.aIdx].y = state.activeSwap.startAY + (state.activeSwap.startBY - state.activeSwap.startAY) * ease;
                boxes[state.activeSwap.bIdx].x = state.activeSwap.startBX + (state.activeSwap.startAX - state.activeSwap.startBX) * ease;
                boxes[state.activeSwap.bIdx].y = state.activeSwap.startBY + (state.activeSwap.startAY - state.activeSwap.startBY) * ease;
                if (p >= 1) state.activeSwap = null;
            }
        }
        if (state.phase === "reveal") {
            boxes.forEach(b => { if (b.id === state.correctBoxId || b.id === state.selectedBoxId) b.lift = Math.min(40, b.lift + 4); });
            if (performance.now() - state.phaseStartedAt > 1500) {
                if (state.selectedBoxId === state.correctBoxId) {
                    state.score++; state.boxCount = Math.min(25, 2 + Math.floor(state.score / 2));
                    updateHUD(); buildRound();
                } else endGame();
            }
        }
    }

    function loop() { if (state.running || state.phase === "reveal") update(); ctx.clearRect(0, 0, canvas.width, canvas.height); boxes.forEach(b => b.draw()); requestAnimationFrame(loop); }
    function updateHUD() { document.getElementById("scoreValue").textContent = state.score; document.getElementById("boxValue").textContent = state.boxCount; }

    function endGame() {
        state.running = false;
        if (state.score > state.best) { state.best = state.score; localStorage.setItem("mg_boutique_best", state.best); document.getElementById("bestValue").textContent = state.best; }
        document.getElementById("finalScore").textContent = state.score;
        document.getElementById("gameOverOverlay").classList.remove("hidden");
    }

    function handleInput(e) {
        if (state.phase !== "pick") return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        const clickX = (clientX - rect.left) * (canvas.width / rect.width);
        const clickY = ((e.clientY || (e.touches ? e.touches[0].clientY : 0)) - rect.top) * (canvas.height / rect.height);
        boxes.forEach(b => { if (clickX > b.x && clickX < b.x + b.w && clickY > b.y && clickY < b.y + b.h) { state.selectedBoxId = b.id; setPhase("reveal"); } });
    }

    document.getElementById("startBtn").onclick = () => { document.getElementById("startOverlay").classList.add("hidden"); state.running = true; state.score = 0; state.boxCount = 2; updateHUD(); buildRound(); };
    document.getElementById("restartBtn").onclick = () => location.reload();
    canvas.addEventListener("mousedown", handleInput);
    canvas.addEventListener("touchstart", (e) => { e.preventDefault(); handleInput(e); }, {passive: false});
    loop();
</script>
</body>
</html>
